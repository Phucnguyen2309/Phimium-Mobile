name: phimium_mobile
description: "Phimium - Saigon food & history tour cùng Buddy địa phương"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.2

dependencies:
  flutter:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  flutter_animate: ^4.5.2
  lottie: ^3.3.1

  # State Management
  flutter_bloc: ^9.1.0
  equatable: ^2.0.7

  # Routing
  go_router: ^15.1.2

  # Dependency Injection
  get_it: ^8.0.3
  injectable: ^2.5.0

  # Networking
  dio: ^5.8.0+1
  retrofit: ^4.4.1
  json_annotation: ^4.9.0
  pretty_dio_logger: ^1.4.0

  # Local Storage
  shared_preferences: ^2.5.3
  flutter_secure_storage: ^9.2.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Utils
  intl: ^0.20.2
  url_launcher: ^6.3.1
  connectivity_plus: ^6.1.4
  permission_handler: ^11.4.0
  image_picker: ^1.1.2
  flutter_dotenv: ^5.2.1
  logger: ^2.5.0
  webview_flutter: ^4.14.1

  # Đã bỏ: video_player, chewie, in_app_purchase (chỉ dùng cho app xem phim/mua xu)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.15
  json_serializable: ^6.9.4
  retrofit_generator: ^10.2.9
  injectable_generator: ^2.7.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
    # .env khong bat buoc. Muon doi dia chi BE: chay
    #   flutter run --dart-define=API_BASE_URL=http://10.0.2.2:8080
    # hoac tao file .env roi them dong "- .env" vao day.
